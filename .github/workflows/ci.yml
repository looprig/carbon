name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.5"

jobs:
  # Format, vet, and the cgo-free -trimpath build on Linux (fast fail).
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: build (cgo-free, -trimpath)
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: govulncheck
        run: go tool govulncheck ./...

  # macOS: real Sandbox execution under the Unconfined profile, and the
  # Darwin fail-closed pre-spawn contract under Trusted -- this is the exact
  # matrix Task 28's own supervised-process integration suite
  # (process_integration_test.go/process_restore_integration_test.go) was
  # written and verified against.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race (default suite)
        run: go test -race -count=1 ./...
      - name: go test -tags integration -race (supervised commands end to end)
        run: go test -tags integration -race -count=1 ./internal/app -run 'TestIntegrationProcess'

  # Compile every package's test binary independently. This catches
  # architecture-specific Windows issues even when the live worker is x64.
  windows-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: windows amd64 package/test binaries
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags integration ./...
      - name: windows arm64 package/test binaries
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -tags integration ./...
